<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>同词相遇</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤝</text></svg>">
<style>
  * { box-sizing: border-box; } [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: linear-gradient(135deg, #ffe8f0, #e8f0ff); padding: 16px; }
  .card { width: 100%; max-width: 480px; background: #fff; border-radius: 22px; padding: 22px; box-shadow: 0 12px 40px rgba(80,80,160,.16); margin: 10px 0; }
  h1 { margin: 0 0 18px; text-align: center; font-size: 26px; color: #333; }
  input { width: 100%; padding: 13px 14px; margin: 7px 0; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; outline: none; }
  input:focus { border-color: #8aa8ff; }
  button { width: 100%; padding: 13px; margin: 7px 0; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600; color: #fff; background: #5b7cfa; cursor: pointer; }
  button:disabled { background: #b9c4e8; cursor: default; }
  .row { display: flex; gap: 8px; } .row input { flex: 1; } .row button { width: 130px; margin: 7px 0; }
  .msg { min-height: 20px; margin: 8px 0 0; text-align: center; color: #e04b6a; font-size: 14px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; color: #666; font-size: 14px; } .top b { color: #333; font-size: 16px; }
  .players { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .player { flex: 1 1 30%; padding: 10px; border-radius: 14px; background: #f5f7ff; text-align: center; font-size: 14px; }
  .player.me { background: #e7edff; outline: 2px solid #8aa8ff; }
  .pname { font-weight: 700; color: #333; margin-bottom: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ptag { font-size: 12px; color: #888; }
  .big { font-size: 22px; font-weight: 800; text-align: center; margin: 14px 0; color: #333; }
  .wordline { padding: 8px 10px; margin: 6px 0; background: #f5f7ff; border-radius: 10px; color: #333; }
  .matchline { color: #e04b6a; font-weight: bold; text-align: center; margin: 10px 0; }
  .history-box { margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 15px; }
  .history-box summary { cursor: pointer; font-size: 15px; font-weight: bold; color: #5b7cfa; text-align: center; outline: none; }
  .history-item { background: #fafafa; border: 1px solid #eee; border-radius: 10px; padding: 12px; margin-top: 10px; font-size: 14px; }
  .history-item h4 { margin: 0 0 8px 0; font-size: 14px; color: #888; }

  .online-text { text-align: center; font-size: 12px; color: #999; margin-top: 15px; }
  /* 跑马灯 */
  .notice-bar { width: 100%; max-width: 480px; background: #fff8e1; color: #e65100; padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: bold; box-shadow: 0 4px 12px rgba(255,143,0,.15); border: 1px solid #ffe082; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
  .notice-icon { margin-right: 8px; font-size: 16px; flex-shrink: 0; }
  .notice-content { display: inline-block; animation: marquee 15s linear infinite; padding-left: 100%; }
  @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
</style>
</head>
<body>

<div id="noticeBar" class="notice-bar" hidden>
  <span class="notice-icon">📢</span>
  <div class="notice-content" id="noticeContent"></div>
</div>

<div id="home" class="card">
  <h1>同词相遇</h1>
  <input id="name" placeholder="你的昵称（最多10字）" maxlength="10">
  <button onclick="createRoom()">创建房间</button>
  <div class="row">
    <input id="code" placeholder="6位房间号" maxlength="6" style="text-transform: uppercase;">
    <button onclick="joinRoom()">加入房间</button>
  </div>
  <p id="homeMsg" class="msg"></p>
  <div class="online-text" id="homeOnline"></div>
</div>

<div id="room" class="card" hidden>
  <div class="top">
    <span style="display: flex; align-items: center;">
      房间号：
      <b id="roomCode" style="cursor: pointer; color: #5b7cfa; margin: 0 6px;" onclick="copyRoomCode()"></b>
      <span id="copyTip" style="font-size: 12px; color: #888; cursor: pointer; background: #eee; padding: 2px 6px; border-radius: 4px;" onclick="copyRoomCode()">📋 复制</span>
    </span>
    <span>第 <b id="round">1</b> 轮</span>
    <span style="color:#ff4d4f; cursor:pointer;" onclick="leaveRoom()">退出</span>
  </div>
  <div id="players" class="players"></div>
  <div id="playArea">
    <input id="word" placeholder="想一个词，等大家提交..." maxlength="20">
    <button id="submitBtn" onclick="submitWord()">提交</button>
  </div>
  <div id="result" hidden></div>
  <button id="nextBtn" hidden onclick="nextRound()">下一轮</button>
  <p id="roomMsg" class="msg"></p>

  <div class="history-box" id="historyBox" hidden>
    <details>
      <summary>📜 点此查看往期回顾</summary>
      <div id="historyList"></div>
    </details>
  </div>
</div>

<script>
let state = { code: '', pid: '', name: '' };
let timer = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function homeMsg(t) { $('homeMsg').textContent = t || ''; }
function roomMsg(t) { $('roomMsg').textContent = t || ''; }

async function api(action, params = {}) {
  const q = new URLSearchParams(params);
  const res = await fetch('/api/' + action + '?' + q.toString(), { cache: 'no-store' });
  return res.json();
}

window.onload = () => {
  const saved = localStorage.getItem('tc_state');
  if (saved) {
    state = JSON.parse(saved);
    $('home').hidden = true; $('room').hidden = false;
    startPoll();
  } else {
    // 即使没在房间里，也去拉取一下在线人数和公告
    fetch('/api/public_stats').then(r=>r.json()).then(d=>{
       if(d.error) return;
       $('homeOnline').textContent = `当前有 ${d.roomCount} 个房间，${d.playerCount} 人在线`;
    }).catch(()=>{});
    // 用 state 空请求拿公告
    fetch('/api/state?code=0000&pid=0000').then(r=>r.json()).then(d=>{
        if(d.notice) renderNotice(d.notice);
    }).catch(()=>{});
  }
};

function saveState() { localStorage.setItem('tc_state', JSON.stringify(state)); }
function clearState() { localStorage.removeItem('tc_state'); $('home').hidden = false; $('room').hidden = true; if(timer) clearInterval(timer); }

function renderNotice(text) {
  if (text && text.trim() !== "") {
    $('noticeBar').hidden = false;
    if ($('noticeContent').textContent !== text) $('noticeContent').textContent = text;
  } else {
    $('noticeBar').hidden = true;
  }
}

async function createRoom() {
  const name = $('name').value.trim() || '玩家';
  homeMsg('创建中...');
  const r = await api('create', { name });
  if (r.error) return homeMsg(r.error);
  state = { code: r.code, pid: r.pid, name }; saveState(); 
  $('home').hidden = true; $('room').hidden = false;
  startPoll();
}

async function joinRoom() {
  const name = $('name').value.trim() || '玩家';
  const code = $('code').value.trim().toUpperCase();
  if (!code) return homeMsg('请输入房间号');
  homeMsg('加入中...');
  const oldPid = state.pid || ''; 
  const r = await api('join', { name, code, oldPid });
  if (r.error) return homeMsg(r.error);
  state = { code: r.code, pid: r.pid, name }; saveState();
  $('home').hidden = true; $('room').hidden = false;
  startPoll();
}

function startPoll() {
  if (timer) clearInterval(timer);
  poll();
  // 🔥 核心防崩优化：从 1000 毫秒改成 5000 毫秒（5秒轮询一次）
  timer = setInterval(poll, 5000); 
}

async function poll() {
  if (!state.code || !state.pid) return;
  const r = await api('state', { code: state.code, pid: state.pid });
  if (r.error) {
    roomMsg(r.error);
    if (r.error.includes('不存在')) clearState(); 
    return;
  }
  render(r);
}

function render(d) {
  renderNotice(d.notice);
  $('roomCode').textContent = d.code;
  $('round').textContent = d.round;

  $('players').innerHTML = d.players.map(p => {
    let tag = p.submitted ? '已提交' : '思考中';
    if (d.revealed) tag = '已揭晓';
    return `<div class="player ${p.isSelf ? 'me' : ''}">
      <div class="pname" title="${esc(p.name)}">${esc(p.name)}${p.isSelf ? '(你)' : ''}</div>
      <div class="ptag">${tag}</div>
    </div>`;
  }).join('');

  const me = d.players.find(p => p.isSelf);

  if (d.revealed) {
    $('playArea').hidden = true; $('result').hidden = false;
    let html = '';
    if (d.matches && d.matches.length > 0) {
      html += `<div class="big">🎉 有人同词相遇！</div>`;
      html += d.matches.map(m => `<div class="matchline">有 ${m.count} 个人想到了：「${esc(m.word)}」</div>`).join('');
    } else {
      html += `<div class="big">😅 完美错过</div>`;
    }
    html += d.players.map(p => `<div class="wordline"><b>${esc(p.name)}</b>：${esc(p.word || '')}</div>`).join('');
    $('result').innerHTML = html;
    $('nextBtn').hidden = false;
    $('nextBtn').disabled = !!(me && me.nextReady);
    $('nextBtn').textContent = me && me.nextReady ? '已准备，等其他人...' : '下一轮';
  } else {
    $('nextBtn').hidden = true;
    if (me && me.submitted) {
      $('playArea').hidden = true; $('result').hidden = false;
      $('result').innerHTML = '<div class="big">已提交，等待其他人...</div>';
    } else {
      $('playArea').hidden = false; $('result').hidden = true;
      roomMsg('');
    }
  }

  if (d.history && d.history.length > 0) {
    $('historyBox').hidden = false;
    const reversed = [...d.history].reverse();
    $('historyList').innerHTML = reversed.map(h => {
      let matchText = h.matches.length > 0 ? `<span style="color:#e04b6a">撞词：${h.matches.map(m=>`${esc(m.word)}(${m.count}人)`).join('，')}</span>` : '<span style="color:#888">未撞词</span>';
      let playersText = h.players.map(p => `${esc(p.name)}: ${esc(p.word)}`).join(' | ');
      return `<div class="history-item"><h4>第 ${h.round} 轮 - ${matchText}</h4><div>${playersText}</div></div>`;
    }).join('');
  } else {
    $('historyBox').hidden = true;
  }
}

async function submitWord() {
  const word = $('word').value.trim();
  if (!word) return roomMsg('先想一个词');
  const r = await api('submit', { code: state.code, pid: state.pid, word });
  if (r.error) return roomMsg(r.error);
  $('word').value = ''; render(r);
}

async function nextRound() {
  const r = await api('next', { code: state.code, pid: state.pid });
  if (r.error) return roomMsg(r.error);
  render(r);
}

function leaveRoom() {
  if (confirm('确定要退出当前房间吗？')) {
    clearState(); state = { code: '', pid: '', name: '' }; $('name').value = '';
    homeMsg('已退出房间');
  }
}

// 复制房间号
function copyRoomCode() {
  const code = state.code; if (!code) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(showCopySuccess).catch(() => fallbackCopy(code));
  } else { fallbackCopy(code); }
}
function fallbackCopy(text) {
  const textArea = document.createElement("textarea");
  textArea.value = text; textArea.style.position = "fixed"; textArea.style.opacity = "0";
  document.body.appendChild(textArea); textArea.select();
  try { document.execCommand('copy'); showCopySuccess(); } catch (err) { alert('复制失败，请手动长按复制'); }
  document.body.removeChild(textArea);
}
function showCopySuccess() {
  const tip = document.getElementById('copyTip');
  tip.textContent = '✅ 已复制'; tip.style.color = '#fff'; tip.style.background = '#52c41a';
  setTimeout(() => { tip.textContent = '📋 复制'; tip.style.color = '#888'; tip.style.background = '#eee'; }, 2000);
}
</script>
</body>
</html>
